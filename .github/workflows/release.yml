name: release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse, without the leading v
        required: true
        type: string
      dry_run:
        description: Validate everything but do not create the release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Publish a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Release notes come from the changelog in the tagged commit, so the full
          # history is unnecessary, but the tag itself must be resolvable.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # The same gate that guards every pull request. A tag is permanent once the Go
      # module proxy has served it, so it runs again here rather than trusting that the
      # tagged commit was green on its way in.
      - run: make check

      - run: make vuln

      - run: make caddy-verify

      - name: Verify the changelog documents this version
        run: make release-check VERSION=${{ steps.version.outputs.version }}

      - name: Extract the release notes
        run: make release-notes VERSION=${{ steps.version.outputs.version }} | tee release-notes.md

      # No binaries are attached. A Go module is published by its tag alone: the module
      # proxy serves the source, and a Caddy binary containing this module is built by
      # whoever links it in, from sources they resolve themselves.
      - name: Create the GitHub release
        if: github.event_name == 'push' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md

      - name: Report what a rehearsal would have done
        if: github.event_name != 'push' || inputs.dry_run
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Dry run: validated $VERSION and skipped creating the release."
