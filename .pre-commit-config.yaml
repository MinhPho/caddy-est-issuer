# Installed with `make hooks`. The runner is prek, a single binary that needs no
# Python; this is the pre-commit config format, so `pre-commit install` also works.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # The changelog is written from these subjects, so a malformed one is a defect
  # rather than a style slip.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: make fmt-check
        language: system
        types: [go]
        pass_filenames: false

      # A push is the last point where a break is cheap. CI runs the same targets,
      # but a hosted runner can leave a bad commit on main unreported for a quarter
      # of an hour, and a tag that has reached the module proxy cannot be moved.
      - id: push-check
        name: make push-check
        entry: make push-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
